name: CI

# Quality gate for every gitflow branch and pull request.
on:
  pull_request:
  push:
    branches: [develop, 'feature/**', 'release/**', 'hotfix/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run tokens
      - name: Generated tokens are committed
        run: git diff --exit-code -- src/styles src/assets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

      - name: Version check (informative)
        run: npm run check:version
