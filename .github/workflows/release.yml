name: Release

# Every push to `main` (a merged release/* or hotfix/* branch, per gitflow):
#   1. runs the full quality gate;
#   2. publishes to npm ONLY if package.json version > version on npm;
#   3. tags vX.Y.Z and creates the GitHub Release;
#   4. deploys the Storybook docs to Cloudflare Pages (works for private repos on any plan).
#
# Repository secrets: NPM_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Optional repository variable: CF_STORYBOOK_PROJECT (default "wrenpages-storybook").
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # tag + GitHub Release

jobs:
  verify:
    name: Quality gate
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - id: version
        run: npm run check:version

  publish:
    name: Publish to npm
    needs: verify
    if: needs.verify.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: npm publish
        # `prepack` builds dist/. Provenance needs a public repository, so it is not used here.
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ needs.verify.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes

  storybook:
    name: Deploy Storybook (Cloudflare Pages)
    needs: verify
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Cloudflare not configured yet
        if: env.HAS_CF != 'true'
        run: echo "::warning::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to publish the Storybook."
      - uses: actions/checkout@v4
        if: env.HAS_CF == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CF == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: env.HAS_CF == 'true'
      - run: npm run build-storybook
        if: env.HAS_CF == 'true'
      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_CF == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy storybook-static --project-name=${{ vars.CF_STORYBOOK_PROJECT || 'wrenpages-storybook' }} --branch=main --commit-dirty=true
